# 税费计算规则（技术方案 4.5）
#
# 为什么规则写成配置而不是代码：
#   · 税率会变（2026 年增值税法施行就是一次大改）。改配置不用改代码、不用重新测试引擎。
#   · 每一条规则都必须能指回依据条款——计算过程要能展示给用户看，也要能被审核专家核对。
#   · 规则带有效期，政策变了旧规则仍可复算历史数据。
#
# 铁律（技术方案 4.5）：涉及金额、税率、期限的计算一律由本引擎完成，
# 不允许模型心算。大模型的算术错误率足以摧毁专业信任。

schema_version: "1.0"
domain_id: finance_tax

# 规则版本。每次改规则都要改这个号——计算结果里会记录用了哪一版，
# 事后能追溯"当时的答案是按哪版规则算的"。
rules_version: "2026.10.1"
# 本版规则的口径时点
as_of: "2026-01-01"
basis_note: 依据《中华人民共和国增值税法》（2026-01-01 施行）及其配套规定

# ---------------------------------------------------------------------------
# 增值税
# ---------------------------------------------------------------------------
vat:
  name: 增值税
  citations:
    - 中华人民共和国增值税法 第八条
    - 中华人民共和国增值税法 第十四条

  methods:
    general:
      name: 一般计税
      formula: 应纳税额 = 销项税额 - 进项税额
      citation: 中华人民共和国增值税法 第十四条
      note: 当期销项税额小于当期进项税额时，差额为留抵税额，不产生应纳税额
    simplified:
      name: 简易计税
      formula: 应纳税额 = 销售额 × 征收率
      citation: 中华人民共和国增值税法 第十四条
      note: 小规模纳税人可以适用简易计税

  # 税率表。与《增值税法》第十条逐项对应。
  rates:
    - rate: "0.13"
      name: 销售货物、加工修理修配服务、有形动产租赁服务、进口货物
      citation: 中华人民共和国增值税法 第十条（一）
      keywords: [货物, 销售货物, 加工修理修配, 有形动产租赁, 进口]
    - rate: "0.09"
      name: 交通运输、邮政、基础电信、建筑、不动产租赁、销售不动产、转让土地使用权及列举货物
      citation: 中华人民共和国增值税法 第十条（二）
      keywords: [交通运输, 邮政, 基础电信, 建筑, 不动产租赁, 销售不动产, 土地使用权, 农产品, 图书, 饲料, 化肥, 农药, 农机, 自来水, 天然气]
    - rate: "0.06"
      name: 销售服务、无形资产（除另有规定外）
      citation: 中华人民共和国增值税法 第十条（三）
      keywords: [服务, 无形资产, 现代服务, 生活服务, 金融, 咨询, 技术服务]
    - rate: "0"
      name: 出口货物、跨境销售国务院规定范围内的服务和无形资产
      citation: 中华人民共和国增值税法 第十条（四）（五）
      keywords: [出口货物, 跨境销售, 出口, 跨境, 零税率]

  levy_rates:
    - rate: "0.03"
      name: 简易计税征收率
      citation: 中华人民共和国增值税法 第十一条

  # 含税价换算。销售额未分别注明含税与否时，先按此换算。
  price_inclusion:
    formula: 不含税销售额 = 含税金额 ÷（1 + 适用税率或征收率）
    citation: 中华人民共和国增值税法 第十六条

  threshold:
    rule: 起征点：销售额未达起征点免征增值税；达到起征点则全额计算
    citation: 中华人民共和国增值税法 第二十三条
    note: 起征点标准由国务院规定。小规模纳税人另有更宽的免税优惠，见文件末尾 discounts 段

# ---------------------------------------------------------------------------
# 附加税费
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 企业所得税（筹划测算要用：小微优惠与基本税率的差额就是节税额）
# ---------------------------------------------------------------------------
cit:
  name: 企业所得税
  rate: "0.25"
  formula: 应纳税额 = 应纳税所得额 × 适用税率
  citation: 中华人民共和国企业所得税法 第四条
  discounts:
    - code: small_low_profit
      name: 小型微利企业优惠
      # 对年应纳税所得额不超过 300 万元的部分，减按 25% 计入应纳税所得额，按 20% 税率缴纳
      # 实际税负 = 25% × 20% = 5%
      include_ratio: "0.25"
      rate: "0.20"
      condition_note: 年应纳税所得额不超过 300 万元、从业人数不超过 300 人、资产总额不超过 5000 万元
      citation: 财政部 税务总局公告2023年第12号
      period: ["2023-01-01", "2027-12-31"]

# ---------------------------------------------------------------------------
# 附加税费
# ---------------------------------------------------------------------------
surcharges:
  name: 附加税费
  # 附加税费的计税依据是"实际缴纳的增值税、消费税税额"，不是销售额。
  base_note: 以纳税人依法实际缴纳的增值税、消费税税额为计税依据

  items:
    - code: urban_maintenance
      name: 城市维护建设税
      base: 实际缴纳的增值税 + 消费税
      citation: 中华人民共和国城市维护建设税法 第二条、第五条
      rates:
        - rate: "0.07"
          name: 纳税人所在地在市区
          citation: 中华人民共和国城市维护建设税法 第四条（一）
        - rate: "0.05"
          name: 纳税人所在地在县城、镇
          citation: 中华人民共和国城市维护建设税法 第四条（二）
        - rate: "0.01"
          name: 纳税人所在地不在市区、县城或者镇
          citation: 中华人民共和国城市维护建设税法 第四条（三）

    - code: education_surcharge
      name: 教育费附加
      base: 实际缴纳的增值税 + 消费税
      rate: "0.03"
      citation: 征收教育费附加的暂行规定 第三条

    - code: local_education_surcharge
      name: 地方教育附加
      base: 实际缴纳的增值税 + 消费税
      rate: "0.02"
      citation: 财政部关于统一地方教育附加政策有关问题的通知（财综〔2010〕98号）
      note: 地方教育附加由各省确定，全国统一为 2%；如有地方特殊规定以当地为准
      # 这份依据**不在我们的知识库里**：它是财政部综合司发的文件，
      # 税务总局政策法规库没有收录。写在这里是为了如实说明"依据是哪份"，
      # 但用户点不开原文，审核时也没法在库里核对——必须显式标记出来，
      # 不能让验收脚本把它当成"已核对通过"。
      citation_in_library: false

# ---------------------------------------------------------------------------
# 优惠规则（带有效期与依据，过期自动失效）
# ---------------------------------------------------------------------------
discounts:
  - code: small_business_half_surcharges
    name: 增值税小规模纳税人、小型微利企业和个体工商户减半征收"六税两费"
    applies_to_tax: [urban_maintenance, education_surcharge, local_education_surcharge]
    condition:
      taxpayer_type: [小规模纳税人, 小型微利企业, 个体工商户]
    effect: 减半征收
    factor: "0.5"
    period: ["2023-01-01", "2027-12-31"]
    citation: 财政部 税务总局公告2023年第12号

  # 小规模纳税人的免税优惠。**必须带上金额门槛**，不能只写"可能适用"。
  #
  # 政策原文写明了金额（含本数）与有效期，规则里就必须同样写全：
  # 只写"免征标准以现行公告为准；本规则只标记'可能适用'"，引擎会照 3%
  # 算出应纳 2,912.62 元，而正确答案是**免征**——规则缺了金额，
  # 等于把政策的一半丢了。
  - code: small_scale_vat_exemption
    name: 小规模纳税人月销售额未超过10万元免征增值税
    applies_to_tax: [vat]
    condition:
      taxpayer_type: [小规模纳税人]
    effect: 免征增值税
    threshold:
      month: "100000"        # 含本数
      quarter: "300000"
    period: ["2023-01-01", "2027-12-31"]
    citation: 财政部 税务总局公告2023年第19号 一、
    note: 以1个季度为1个纳税期的，季度销售额未超过30万元同样免征

  # 3% 征收率减按 1%。同样是"政策写明了就按它算"。
  - code: small_scale_levy_rate_reduction
    name: 小规模纳税人适用3%征收率的应税销售收入减按1%征收率征收增值税
    applies_to_tax: [vat]
    condition:
      taxpayer_type: [小规模纳税人]
    effect: 减按1%征收率
    from_rate: "0.03"
    to_rate: "0.01"
    period: ["2023-01-01", "2027-12-31"]
    citation: 财政部 税务总局公告2023年第19号 二、
